<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Reset - L Storm</title>
<link rel="icon" type="image/png" href="favicon.png">

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: white;
    background: url("Hat.png") no-repeat center center fixed;
    background-size: cover;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(12, 15, 20, 0.85);
  }

  .container {
    position: relative;
    z-index: 1;
    background: rgba(0,0,0,0.4);
    padding: 40px 30px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    text-align: center;
    width: 90%;
    max-width: 400px;
    backdrop-filter: blur(8px);
  }

  h1 {
    margin-bottom: 10px;
  }

  .dynamic-message {
    margin-bottom: 20px;
    color: #c8a85d;
    font-size: 16px;
    min-height: 40px;
  }

  input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #0b0f18;
    color: white;
    margin-bottom: 15px;
  }

  .btn {
    width: 100%;
    padding: 12px;
    background: #c8a85d;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
  }

  .btn:hover {
    filter: brightness(1.1);
  }

  .status {
    margin-top: 15px;
    font-size: 14px;
  }
</style>
</head>

<body>

<div class="container">
  <h1>Reset Password</h1>
  <div class="dynamic-message" id="message"></div>

  <form id="resetForm">
    <input type="email" id="email" placeholder="Enter your email" required>
    <button type="submit" class="btn">Send Reset Link</button>
  </form>

  <div class="status" id="status"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBGkGnNraXonGNCMH0kQH0HcdgVQeDDqjI",
  authDomain: "storm-center-5f5fd.firebaseapp.com",
  projectId: "storm-center-5f5fd",
  storageBucket: "storm-center-5f5fd.firebasestorage.app",
  messagingSenderId: "371213361425",
  appId: "1:371213361425:web:089e296a06e7aef929acb0",
  measurementId: "G-1S65R6PFE7"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// 🔥 RANDOM MESSAGES
const messages = [
  "We found the hat… but where’s the ball?",
  "Looks like we’re lost in a storm… let’s find the way back.",
  "The wind’s picking up — steady now.",
  "We lost the trail… let’s get you back on track.",
  "The storm’s rolling in — take control.",
  "Hat secured. Ball missing. Let’s fix that.",
  "Something’s drifted off… time to pull it back."
];

const messageEl = document.getElementById("message");
messageEl.textContent = messages[Math.floor(Math.random() * messages.length)];

// 🔐 RESET EMAIL
const form = document.getElementById("resetForm");
const status = document.getElementById("status");

form.addEventListener("submit", (e) => {
  e.preventDefault();

  const email = document.getElementById("email").value;

  sendPasswordResetEmail(auth, email)
    .then(() => {
      status.style.color = "#c8a85d";
      status.textContent = "Reset link sent. Check your inbox.";
    })
    .catch((error) => {
      status.style.color = "red";
      status.textContent = error.message;
    });
});
</script>

</body>
</html>
